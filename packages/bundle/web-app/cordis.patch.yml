# The clocky-web-app bundle patch: the browser surface over the clocky-base layer.
# Applied after clocky-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `clocky --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# TODO: Re-enable shared HMR for Web after its reload lifecycle is tested.
- id: hmr
  disabled: true

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: CLOCKY_TOOLS_MODE (native|code|both) opts a whole clocky
    # process into Code Mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.CLOCKY_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `clocky.client` rows are the browser roster the modules node half scans into
# window.__CLOCKY_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: code-runtime
      name: '@clocky/clocky-code-runtime-worker-thread'

    # The Web Host owns the shipped local authentication boundary. It waits for
    # a real Web invocation, so --help never rotates a bootstrap credential.
    - id: product-principal-local
      name: '@clocky/clocky-host-product-principal-local'
      inject: [webStartup]

    - id: storage
      name: '@clocky/clocky-storage'

    - id: storage-json
      name: '@clocky/clocky-storage-json'
      config:
        root: !!js clockyHomePath('storages')

    - id: storage-sqlite
      name: '@clocky/clocky-storage-sqlite'
      config:
        path: !!js clockyHomePath('team-storage.sqlite')

    - id: storage-log
      name: '@clocky/clocky-storage-log'
      config:
        backend: sqlite
        routes: {}

    - id: team-hub
      name: '@clocky/clocky-team-hub'
      config:
        maxTeamDepth: 1
        maxModelTokensPerTeam: 100000000


    - id: team-human-client
      name: '@clocky/clocky-team-human-client'
      config:
        storagePageSize: 32
        maxPageSize: 32
        maxDeliveryBytes: 262144
        maxPendingOperations: 128
        watchTimeoutMs: 30000
        pollIntervalMs: 250
    - id: team-human-actor
      name: '@clocky/clocky-team-human-actor'

    - id: team-channel-summary
      name: '@clocky/clocky-team-channel-summary'
      config:
        allowedPolicies: [directed, summarized-window]
        maxSourceEnvelopes: 64
        maxSourceBytes: 65536
        maxSummaryBytes: 4096
        maxHistorySpan: 128
        disposalTimeoutMs: 5000

    - id: team-channel-direct
      name: '@clocky/clocky-team-channel-direct'

    - id: team-channel-basic
      name: '@clocky/clocky-team-channel-basic'

    - id: team-workspace
      name: '@clocky/clocky-team-workspace'

    - id: team-artifact
      name: '@clocky/clocky-team-artifact'

    - id: team-artifact-local
      name: '@clocky/clocky-team-artifact-local'
      config:
        root: !!js clockyHomePath('team-artifacts')
        retention:
          graceMs: 86400000
          maxObjectsPerDrive: 128
          pulseIntervalMs: 3600000
          disposalTimeoutMs: 5000

    - id: team-workspace-shared
      name: '@clocky/clocky-team-workspace-shared'
      config:
        root: !!js process.cwd()
        allowTeamWorkspacePath: true
        observationStateRoot: !!js clockyHomePath('team-workspace-observations')
        observationExcludedRoots:
          - !!js clockyHomePath()

    - id: team-workspace-recovery
      name: '@clocky/clocky-team-workspace-recovery'
      inject: [loader]
      intercept:
        loader:
          await: true
      config:
        maxTeamsPerDrive: 128
        pageSize: 32

    - id: team-channel-task-assignment
      name: '@clocky/clocky-team-channel-task-assignment'

    - id: team-channel-workflow
      name: '@clocky/clocky-team-channel-workflow'

    - id: team-agent-runtime
      name: '@clocky/clocky-agent-runtime'

    - id: team-agent-runtime-in-process
      name: '@clocky/clocky-agent-runtime-in-process'

    - id: team-activation-controller
      name: '@clocky/clocky-team-activation-controller'

    - id: team-link
      name: '@clocky/clocky-team-link'

    - id: team-link-local
      name: '@clocky/clocky-team-link-local'

    - id: team-channel-admission
      name: '@clocky/clocky-team-channel-admission'

    - id: team-agent-client
      name: '@clocky/clocky-team-agent-client'
      config:
        consumeWorkspace: true
        maxTaskOutputContinuations: 3

    - id: tool-team
      name: '@clocky/clocky-tool-team'

    - id: team-delegation
      name: '@clocky/clocky-team-delegation'
      config:
        maxOperationsPerDrive: 32
        channelPageSize: 128
        pulseIntervalMs: 1000

    - id: team-placement-default
      name: '@clocky/clocky-team-placement-default'
      config:
        routes: []
        maxActivationsPerDrive: 8
        maxCursorRetries: 4

    - id: team-scheduler-dag
      name: '@clocky/clocky-team-scheduler-dag'
      config:
        leaseDurationMs: 3600000
        maxAssignmentsPerDrive: 8
        maxExpirationsPerDrive: 1
        maxWakeDispatchesPerDrive: 8
        maxConflictsPerDrive: 4
        maxActiveAttemptsPerParticipant: 1
        permittedWorkspaceModes: [shared]
        pulseIntervalMs: 1000
        disposalTimeoutMs: 5000

    - id: team-closure-drive-registry
      name: '@clocky/clocky-team-closure-driver/registry'

    - id: team-closure-driver-hub
      name: '@clocky/clocky-team-closure-driver/hub'
      config:
        backend: hub

    - id: team-closure-driver
      name: '@clocky/clocky-team-closure-driver'
      config:
        backend: hub
        maxTeamsPerDrive: 128
        pageSize: 32
        disposalTimeoutMs: 5000
        pulseIntervalMs: 1000

    - id: team-run
      name: '@clocky/clocky-team-run'
      config:
        maxChildTeams: 32
        maxLiveActivations: 128
        workerCount: 1
        maxWorkerCount: 32
        maxCoordinatorOutputContinuations: 3
        workerPreset: minimal
        reviewerPreset: minimal

    - id: command-team-goal
      name: '@clocky/clocky-command-team-goal'

    - id: tool-team-channel-summary
      name: '@clocky/clocky-team-channel-summary/tool'

    - id: tool-team-goal
      name: '@clocky/clocky-tool-team-goal'

    - id: tool-team-task
      name: '@clocky/clocky-tool-team-task'

    - id: storage-domain
      name: '@clocky/clocky-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@clocky/clocky-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@clocky/clocky-session-log-export'

    - id: workspace
      name: '@clocky/clocky-workspace'

    - id: session-projection-cache
      name: '@clocky/clocky-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-reference
      name: '@clocky/clocky-session-reference'

    - id: file-reference-local
      name: '@clocky/clocky-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@clocky/clocky-session-stats'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching host directory-picker backend.
    - id: directory-picker
      name: '@clocky/clocky-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@clocky/clocky-host-plugin-inventory'

    # The API gateway: the transport-agnostic dispatch face every client shape
    # shares. Wait for the human-proof binder before exposing Team mutations;
    # otherwise an early task delete can race the provider and fail as if no
    # authenticated Team actor exists. The base layer's agent-default-model
    # service owns the default model.
    - id: api-gateway
      name: '@clocky/clocky-host-apiproxy'
      inject: [teamHumanActors]

    - id: cordis-host-runner
      name: '@clocky/clocky-cordis-host-runner'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@clocky/clocky-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@clocky/clocky-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of clocky-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles. The webStartup provider
    # supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@clocky/clocky-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts
        productPrincipalProvider: local

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@clocky/clocky-client-hmr'

    # ── browser plugin roster (clocky.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__CLOCKY_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@clocky/clocky-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@clocky/clocky-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts
        productPrincipalProvider: !!js ctx.webRuntime.productPrincipalProvider

    - id: api-remotes
      name: '@clocky/clocky-api-remotes'

    - id: client-runtime
      name: '@clocky/clocky-client-runtime'

    - id: cordis-client-runner
      name: '@clocky/clocky-cordis-client-runner'

    - id: ui-theme
      name: '@clocky/clocky-client-ui-theme'

    - id: locale
      name: '@clocky/clocky-client-locale'

    - id: ui-layout
      name: '@clocky/clocky-client-ui-layout'

    - id: ui-renderer
      name: '@clocky/clocky-client-ui-renderer'

    - id: ui-sidebar
      name: '@clocky/clocky-client-ui-sidebar'

    - id: ui-team
      name: '@clocky/clocky-client-ui-team'

    - id: ui-settings
      name: '@clocky/clocky-client-ui-settings'

    - id: ui-settings-general
      name: '@clocky/clocky-client-ui-settings-general'

    - id: ui-settings-models
      name: '@clocky/clocky-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@clocky/clocky-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@clocky/clocky-client-ui-conversation'

    - id: ui-attachment
      name: '@clocky/clocky-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@clocky/clocky-client-ui-tool'

    - id: ui-cordis
      name: '@clocky/clocky-client-ui-cordis'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@clocky/clocky-client-ui-deliverables'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@clocky/clocky-client-ui-input-trigger'

    - id: ui-commands
      name: '@clocky/clocky-client-ui-commands'

    - id: ui-skill
      name: '@clocky/clocky-client-ui-skill'

    - id: ui-reference
      name: '@clocky/clocky-client-ui-reference'

    # Background jobs: the session-header list over the jobsBySession mirror.
    - id: ui-jobs
      name: '@clocky/clocky-client-ui-jobs'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@clocky/clocky-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over Session and Team-draft catalogs.
    - id: ui-model-selection
      name: '@clocky/clocky-client-ui-model-selection'

    - id: ui-permission
      name: '@clocky/clocky-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@clocky/clocky-client-ui-agent-preset'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@clocky/clocky-client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@clocky/clocky-client-ui-plan'

    - id: ui-user-questions
      name: '@clocky/clocky-client-ui-user-questions'

    - id: ui-trajectory
      name: '@clocky/clocky-client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools and prompt sections. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `CLOCKY_WEB_URL`/`CLOCKY_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers resolve it with `ctx.get`, and an
# entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. `config/agent-presets/` ships with the deployment and is
# read-only (its entries carry `system` trust); `$CLOCKY_HOME/.agent-presets` is
# where a person — or an agent — authors their own, and carries the same trust
# as shell access because a preset IS a composition.
#
# Only the SHIPPED root is an assembly fact: it sits beside the installed app's
# own config, so `apps/cli`'s `composeProfile` resolves and patches it in — the
# same treatment `distIndex` gets on the webserver row. The writable root is
# `clocky-agent-presets`' own default (`includeUserRoot`), so a composition that
# never reaches that patch still finds a person's presets.
- insert:
    - id: agent-presets
      name: '@clocky/clocky-agent-presets'
      config:
        default: standard
