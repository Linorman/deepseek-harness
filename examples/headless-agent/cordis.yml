# One-shot coding agent with format-pure stdout. The app bin loads the
# gitignored root `.env` into the process environment; entry configs here are
# the composition base, while user-plane values resolve per request through
# the two providers below.

# User-settings document (`$CLOCKY_HOME/settings.yaml`, hot-reloaded): an
# `llm-pi-ai:` section overrides the adapter entry below without a restart.
- id: settings
  name: '@clocky/clocky-settings-file'

# Credential store: the live process environment over `$CLOCKY_HOME/.credentials.yaml`
# (owner-only file, hot-reloaded). The adapter resolves `DEEPSEEK_API_KEY`
# through it at each request, so no key is inlined in this file.
- id: credentials
  name: '@clocky/clocky-credentials-local'

# DeepSeek is one provider profile of the generic pi-ai adapter.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoning: max
        models:
          - id: deepseek-v4-pro
            contextWindow: 128000
          - id: deepseek-v4-flash
            contextWindow: 128000
      # Explicit local OpenAI-compatible route for real-model development
      # tests. The canonical local endpoint is part of this example's static
      # composition; the environment only selects the route.
      local-vllm:
        apiKeyEnv: CLOCKY_LOCAL_MODEL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18000/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
        reasoning: !!js "process.env.CLOCKY_LOCAL_MODEL_REASONING_EFFORT ?? undefined"
        defaultContextWindow: 131072
        defaultMaxTokens: 5120
        models:
          - id: !!js process.env.CLOCKY_LOCAL_MODEL_ID ?? 'Qwen3.8-27B-AWQ-4bit'
            contextWindow: 131072
            maxTokens: 5120
            reasoningEfforts:
              off:
              minimal: low
              low: low
              medium: medium
              high: xhigh
              xhigh: xhigh
              max: xhigh

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
# Replay and refresh overlays replace the provider and model with the scripted
# route; normal and record runs keep the explicit DeepSeek provider profile.
- id: agent-spine
  name: '@clocky/clocky-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: !!js "process.env.CLOCKY_SNAPSHOT !== undefined && process.env.CLOCKY_SNAPSHOT !== 'record' ? 'test-provider' : (process.env.CLOCKY_LOCAL_MODEL_BASE_URL ? 'local-vllm' : 'deepseek')"
        model: !!js "process.env.CLOCKY_SNAPSHOT !== undefined && process.env.CLOCKY_SNAPSHOT !== 'record' ? 'test-model' : (process.env.CLOCKY_LOCAL_MODEL_BASE_URL ? (process.env.CLOCKY_LOCAL_MODEL_ID ?? 'Qwen3.8-27B-AWQ-4bit') : 'deepseek-v4-flash')"
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@clocky/clocky-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@clocky/clocky-session-checkpoint-policy'

# Summarize an older range when derived history approaches the context window.
- id: token-meter
  name: '@clocky/clocky-token-meter'

- id: compaction-basic
  name: '@clocky/clocky-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: durable subagent identity (mode/label) folds through
# its registered units; subagent catalog reads fail loud without the capability.
- id: session-projection
  name: '@clocky/clocky-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through independent
# in-process backends.
- id: subagent
  name: '@clocky/clocky-compat-subagent'

- id: subagent-spawn-in-process
  name: '@clocky/clocky-compat-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@clocky/clocky-compat-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control registers global `send_message`; `report` is
# installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@clocky/clocky-compat-tool-subagent-control'

- id: tool-subagent-report
  name: '@clocky/clocky-compat-tool-subagent-report'

- id: tool-subagent
  name: '@clocky/clocky-compat-tool-subagent'
  config:
    provider: spawn
    toolName: legacy_subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork stays one-shot because a continuable child's `report` tool and prompt
# section precede the inherited history a fork reuses; `run_in_background` is off
# as an explicit foreground-only choice even though agent-spine-demo mounts the
# generic Job runtime. See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
- id: tool-subagent-fork
  name: '@clocky/clocky-compat-tool-subagent'
  config:
    provider: fork
    toolName: legacy_subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend.
- id: workflow-worker-thread
  name: '@clocky/clocky-compat-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@clocky/clocky-compat-tool-workflow'

# A separate fixed consumer demonstrates fresh-agent Ralph iteration without
# changing the workflow tool or same-session goal behavior.
- id: tool-ralph
  name: '@clocky/clocky-compat-tool-ralph'

# `todo_write` replaces the logged whole list.
- id: tool-todo
  name: '@clocky/clocky-tool-todo'
  config:
    allowParallelInProgress: true

# Policy loads before the model-facing filesystem tools so writes and edits
# require an observed file. Relative paths resolve from the process cwd.
- id: fs-local
  name: '@clocky/clocky-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@clocky/clocky-fs-observation-policy'

- id: tool-fs
  name: '@clocky/clocky-tool-fs'
