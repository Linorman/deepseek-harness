# Replay counterpart to goal.cordis.yml. It includes cordis.yml directly because
# a config patch cannot target an entry behind a nested include, then restates
# the goal overlay while replacing the live model with keyless replay.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - insert:
          - id: goal
            name: '@clocky/clocky-goal'
          - id: tool-goal
            name: '@clocky/clocky-tool-goal'
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
