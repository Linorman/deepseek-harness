# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@clocky/clocky-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@clocky/clocky-terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@clocky/clocky-tool-terminal'
            config:
              maxResultBytes: 65
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
