- id: team-run
  config:
    workerCount: 0
    maxWorkerCount: 0
    members:
      - role: researcher
        displayName: Researcher
        kind: local-agent
        capabilities: [team-default-worker]
        provider: in-process
        modelProvider: headless-team-task-mock
        model: headless-team-task-mock
        preset: standard
        maxTokens: 4096

- id: team-placement-default
  config:
    routes:
      - provider: in-process
        roles: [researcher]
        model: headless-team-task-mock/headless-team-task-mock
        modelProvider: headless-team-task-mock
        modelId: headless-team-task-mock
        preset: standard
        cwd: !!js process.cwd()
        maxTokens: 4096
    maxActivationsPerDrive: 8
    maxCursorRetries: 4
