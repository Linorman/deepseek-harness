# Replay counterpart to advanced.cordis.yml. It includes the base `cordis.yml`
# directly — a config patch cannot target an entry behind a nested include — and
# restates advanced.cordis.yml's overlay (the agent and persistence configs plus the
# code-runtime and tool-cordis inserts) so the whole app config lives in one patch.
# It re-pins `test-model`: `cordis.yml` ships `test-model-pro`, but the
# recorded corpus (request headers, provenance) was captured on flash, so replay
# holds the recorded model to stay reproducible without a re-record. It also
# disables the key-requiring provider adapter and inserts `llm-replay` to serve
# recorded JSONL without a key or network.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - id: agent-spine
        name: '@clocky/clocky-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: test-provider
              model: test-model
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: persistence
        name: '@clocky/clocky-session-persistence-jsonl'
        config:
          root: './.sessions'
          # Replay fixtures are raw JSONL; the whole-config patch must restate
          # the compression choice or the default zstd frames hide the logs.
          compression: none
      - insert:
          - id: code-runtime
            name: '@clocky/clocky-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@clocky/clocky-cordis-host-runner'
          - id: tool-cordis
            name: '@clocky/clocky-tool-cordis'
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
