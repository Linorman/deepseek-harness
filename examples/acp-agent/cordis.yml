# ACP automation server and backend snapshot-record composition. With
# `CLOCKY_SNAPSHOT=record`, the app bin runs the configured provider route and the
# harness harvests its persisted log. The bin loads the gitignored root `.env`
# before this config. This tree has no stdout logger or HMR because stdout
# carries ACP JSON-RPC.

# DeepSeek is configured through the generic pi-ai adapter. The provider remains
# an explicit composition choice; the base profile does not select a provider.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoning: max
        models:
          - id: deepseek-v4-flash
          - id: deepseek-v4-pro
          - id: deepseek-v4-flash-vision-exp
            input: [text, image]
      # Static local route for text-only live ACP development. The app below
      # selects it only when CLOCKY_LOCAL_MODEL_BASE_URL is non-empty; snapshot
      # overlays replace the app config and keep their recorded DeepSeek route.
      local-vllm:
        apiKeyEnv: CLOCKY_LOCAL_MODEL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18000/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
        reasoning: !!js "process.env.CLOCKY_LOCAL_MODEL_REASONING_EFFORT ?? undefined"
        defaultContextWindow: 131072
        defaultMaxTokens: 5120
        models:
          - id: !!js process.env.CLOCKY_LOCAL_MODEL_ID ?? 'Qwen3.8-27B-AWQ-4bit'
            contextWindow: 131072
            maxTokens: 5120
            reasoningEfforts:
              off:
              minimal: low
              low: low
              medium: medium
              high: xhigh
              xhigh: xhigh
              max: xhigh

# The default composition confines bash AND the filesystem tools to the
# workspace and asks before a wider retry. Snapshot runs select
# danger-full-access so the established scenarios remain runner-independent;
# CLOCKY_PERMISSION_MODE provides the same explicit deployment/test override
# outside the snapshot harness. The sandbox default + fallback root live on
# ctx.sandboxPolicy; agent calls resolve both families against the session cwd.
- id: sandbox
  name: '@clocky/clocky-sandbox-local'

- id: sandbox-policy
  name: '@clocky/clocky-sandbox-policy'
  config:
    mode: !!js "process.env.CLOCKY_PERMISSION_MODE ?? (process.env.CLOCKY_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js process.cwd()

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@clocky/clocky-user-approval'
  config:
    policy: !!js "(process.env.CLOCKY_PERMISSION_MODE ?? (process.env.CLOCKY_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

# Legacy one-shot replay scripts end with assistant text. Snapshot mode alone
# materializes their outer Team final before the coordinator turn closes.
- id: team-snapshot-finalizer
  name: ./tests/fixtures/team-snapshot-finalizer.ts
  disabled: !!js process.env.CLOCKY_SNAPSHOT === undefined

# The ACP automation app: agent spine, TeamRun, durable stores, and protocol bridge.
# The Team storage root derives below this JSONL persistence root, so snapshot
# cleanup owns both durable forms.
# Snapshot modes use raw JSONL fixtures; ordinary runs keep the compressed default.
- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: !!js "process.env.CLOCKY_LOCAL_MODEL_BASE_URL ? 'local-vllm' : 'deepseek'"
    model: !!js "process.env.CLOCKY_LOCAL_MODEL_BASE_URL ? (process.env.CLOCKY_LOCAL_MODEL_ID ?? 'Qwen3.8-27B-AWQ-4bit') : 'deepseek-v4-pro'"
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext:
      maxBytes: 65536
    # Keep the persona to identity and behavior; tool plugins own tool guidance.
    # The coordinator resolves {{model}} and the client-supplied {{cwd}}.
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

# Replay-aware request pressure; the routed adapter supplies model capacity.
- id: token-meter
  name: '@clocky/clocky-token-meter'

# Summarize an older range after measured pressure or a canonical provider overflow.
# Ratios scale against the routed model's context window.
- id: compaction-basic
  name: '@clocky/clocky-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# `todo_write` replaces the logged whole list for later model requests.
- id: tool-todo
  name: '@clocky/clocky-tool-todo'
  config:
    allowParallelInProgress: true

# Identical repeat calls trigger advisory context, never a block, at the default
# thresholds [3, 5, 8]. Only the repeat-tool-reminder snapshot scenario reaches them.
- id: repeat-tool-reminder
  name: '@clocky/clocky-repeat-tool-reminder'

# The filesystem stack rides the SAME sandbox policy as bash: clocky-fs-sandbox
# replaces clocky-fs-local behind ctx.fs and fences write/edit by the effective
# mode (read-only denies, workspace-write contains to the workspace + temp
# roots, danger-full-access passes through), so read/write/edit are available
# under every mode. fs-observation-policy (read-before-edit) composes orthogonally on top.
- id: fs-sandbox
  name: '@clocky/clocky-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@clocky/clocky-fs-observation-policy'

- id: tool-fs
  name: '@clocky/clocky-tool-fs'
