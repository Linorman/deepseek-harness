# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-replay
  name: '@clocky/clocky-llm-replay'
  config:
    providers:
      - id: test-provider
        name: Test Provider
        models:
          - id: test-model-pro

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-local'

- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: test-provider
    model: test-model-pro
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: team-snapshot-finalizer
  name: ./fixtures/team-snapshot-finalizer.ts

- id: tool-fs-search
  name: '@clocky/clocky-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
