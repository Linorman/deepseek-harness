# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@clocky/clocky-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: terminal
  name: '@clocky/clocky-terminal'

- id: terminal-pwsh
  name: '@clocky/clocky-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: deepseek
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@clocky/clocky-tool-pwsh-persistent'
