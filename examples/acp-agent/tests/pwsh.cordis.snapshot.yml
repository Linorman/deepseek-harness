# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-replay
  name: '@clocky/clocky-llm-replay'
  config:
    providers:
      - id: test-provider
        name: Test Provider
        models:
          - id: test-model-pro

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-pwsh-local'

- id: shell-env
  name: '@clocky/clocky-shell-env'

- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: test-provider
    model: test-model-pro
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: team-snapshot-finalizer
  name: ./fixtures/team-snapshot-finalizer.ts

- id: tool-pwsh
  name: '@clocky/clocky-tool-pwsh'
