# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@clocky/clocky-system-prompt'

- id: tools
  name: '@clocky/clocky-tools'

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@clocky/clocky-shell-env'

- id: tasks
  name: '@clocky/clocky-jobs-local'

- id: tool-jobs
  name: '@clocky/clocky-tool-jobs'

- id: tool-pwsh
  name: '@clocky/clocky-tool-pwsh'
