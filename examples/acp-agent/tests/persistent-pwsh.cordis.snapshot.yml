# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-replay
  name: '@clocky/clocky-llm-replay'
  config:
    providers:
      - id: test-provider
        name: Test Provider
        models:
          - id: test-model-pro

- id: terminal
  name: '@clocky/clocky-terminal'

- id: sandbox-policy
  name: '@clocky/clocky-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: terminal-pwsh
  name: '@clocky/clocky-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: test-provider
    model: test-model-pro
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: team-snapshot-finalizer
  name: ./fixtures/team-snapshot-finalizer.ts

- id: tool-pwsh-persistent
  name: '@clocky/clocky-tool-pwsh-persistent'
