# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@clocky/clocky-acp-demo'
        config:
          provider: test-provider
          model: test-model
          persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: lsp
            name: '@clocky/clocky-lsp'
          - id: lsp-stdio
            name: '@clocky/clocky-lsp-stdio'
            config:
              servers:
                fixture:
                  command: !!js process.execPath
                  args: ['./lsp-server.mjs']
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-policy
            name: '@clocky/clocky-tool-call-timeout-policy'
          - id: tool-lsp
            name: '@clocky/clocky-tool-lsp'
            config:
              maxLocations: 1
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
