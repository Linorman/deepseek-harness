# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-v4-pro

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-local'

- id: acp-agent
  name: '@clocky/clocky-acp-demo'
  config:
    provider: deepseek
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@clocky/clocky-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
