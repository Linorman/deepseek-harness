# Keyless replay combines Code Mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@clocky/clocky-acp-demo'
        config:
          provider: test-provider
          model: test-vision-model
          persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: code
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@clocky/clocky-attachment-local'
          - id: code-runtime
            name: '@clocky/clocky-code-runtime-worker-thread'
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
            config:
              providers:
                - id: test-provider
                  name: Test Provider
                  models:
                    - id: test-model
                      inputModalities: [text]
                    - id: test-model-pro
                      inputModalities: [text]
                    - id: test-vision-model
                      inputModalities: [text, image]
