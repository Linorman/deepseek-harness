# Test-only depth-limit overlay for direct spawn children.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./legacy-subagent.cordis.yml
    patches:
      - id: tool-subagent
        name: '@clocky/clocky-compat-tool-subagent'
        config:
          provider: spawn
          toolName: legacy_subagent
          backgroundMode: continuable
          maxDepth: 2
