# Test-only legacy delegation composition. Product ACP tasks use TeamRun; this
# overlay retains direct subagent and workflow coverage for their owning packages.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: session-projection
            name: '@clocky/clocky-session-projection'
          - id: subagent
            name: '@clocky/clocky-compat-subagent'
          - id: subagent-spawn-in-process
            name: '@clocky/clocky-compat-subagent-spawn-in-process'
            config:
              providerName: spawn
          - id: subagent-fork-in-process
            name: '@clocky/clocky-compat-subagent-fork-in-process'
            config:
              providerName: fork
          - id: tool-subagent-control
            name: '@clocky/clocky-compat-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@clocky/clocky-compat-tool-subagent-control/list-agents'
          - id: tool-subagent-report
            name: '@clocky/clocky-compat-tool-subagent-report'
          - id: tool-subagent
            name: '@clocky/clocky-compat-tool-subagent'
            config:
              provider: spawn
              toolName: legacy_subagent
              backgroundMode: continuable
              maxDepth: 1
          - id: tool-subagent-fork
            name: '@clocky/clocky-compat-tool-subagent'
            config:
              provider: fork
              toolName: legacy_subagent_fork
              backgroundMode: one-shot
              enableRunInBackground: false
              maxDepth: 1
          - id: workflow-worker-thread
            name: '@clocky/clocky-compat-workflow-worker-thread'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@clocky/clocky-compat-tool-workflow'
          - id: tool-ralph
            name: '@clocky/clocky-compat-tool-ralph'
