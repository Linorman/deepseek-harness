# Keyless counterpart to child-question.cordis.yml: keep the real interaction
# seam, model-facing tool, and tripwire provider while replacing the live route with
# per-session replay.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - id: sandbox
        name: '@clocky/clocky-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - id: acp-agent
        name: '@clocky/clocky-acp-demo'
        config:
          provider: test-provider
          model: test-model
          persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
            config:
              providers:
                - id: test-provider
                  name: Test Provider
                  models:
                    - id: test-model
                    - id: test-model-pro
          - id: user-questions
            name: '@clocky/clocky-user-questions'
          - id: tool-ask-user
            name: '@clocky/clocky-tool-ask-user'
          - id: child-question-tripwire
            name: './tests/fixtures/child-question-tripwire.ts'
