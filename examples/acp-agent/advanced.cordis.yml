# Test-only legacy delegation plus Code Mode and Cordis tools.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./legacy-subagent.cordis.yml
    patches:
      - id: acp-agent
        name: '@clocky/clocky-acp-demo'
        config:
          provider: deepseek
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@clocky/clocky-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@clocky/clocky-cordis-host-runner'
          - id: tool-cordis
            name: '@clocky/clocky-tool-cordis'
