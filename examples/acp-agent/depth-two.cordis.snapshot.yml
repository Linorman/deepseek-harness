# Keyless counterpart to depth-two.cordis.yml: apply the depth patch and replace
# the live adapter with per-session replay.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./legacy-subagent.cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - id: sandbox
        name: '@clocky/clocky-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - id: tool-subagent
        name: '@clocky/clocky-compat-tool-subagent'
        config:
          provider: spawn
          toolName: legacy_subagent
          backgroundMode: continuable
          maxDepth: 2
      # Re-pin the recorded model: cordis.yml ships test-model-pro, but this
      # scenario's corpus was captured on flash. A config patch replaces the
      # whole app config, so the base fields are restated verbatim.
      - id: acp-agent
        name: '@clocky/clocky-acp-demo'
        config:
          provider: test-provider
          model: test-model
          persistenceRoot: !!js process.env.CLOCKY_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
            config:
              providers:
                - id: test-provider
                  name: Test Provider
                  models:
                    - id: test-model
                    - id: test-model-pro
