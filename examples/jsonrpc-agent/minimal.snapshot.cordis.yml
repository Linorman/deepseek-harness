# Keyless replay keeps the complete minimal composition intact and replaces
# only its live provider adapter with the fixture-backed provider. The replay
# catalog claims the same route initialized by the SDK.
- id: base
  name: '@clocky/cordis-plugin-include'
  config:
    path: ./minimal.cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@clocky/clocky-llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@clocky/clocky-llm-replay'
            config:
              providers:
                - id: test-provider
                  name: Test Provider
                  models:
                    - id: test-model

- id: team-snapshot-finalizer
  name: ./tests/fixtures/team-snapshot-finalizer.ts
