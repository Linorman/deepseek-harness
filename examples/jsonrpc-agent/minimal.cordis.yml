# Complete unattended minimal-agent composition for the Python SDK. The model
# sees one deployment-selected system prompt and only the owner-scoped
# persistent Bash and string-replace editor tools. Runtime-context injection and
# context compaction are absent.

- id: product-principals
  name: '@clocky/clocky-product-principal'

- id: sdk-product-principal
  name: './tests/fixtures/sdk-product-principal.ts'

- id: sdk-jsonrpc-server
  name: '@clocky/clocky-sdk-jsonrpc-server'

- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      test-provider:
        apiKeyEnv: TEST_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:9
        streamIdleTimeoutMs: 172800000
        models:
          - id: !!js process.env.CLOCKY_MODEL
            contextWindow: !!js Number(process.env.CLOCKY_CONTEXT_WINDOW ?? 1000000)

- id: agent-default-model
  name: '@clocky/clocky-agent-default-model'
  config:
    provider: test-provider
    model: !!js process.env.CLOCKY_MODEL

- id: sandbox
  name: '@clocky/clocky-sandbox-local'

- id: sandbox-policy
  name: '@clocky/clocky-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.CLOCKY_CWD ?? process.cwd()

- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: pty
  name: '@clocky/clocky-terminal'

- id: terminal-bash
  name: '@clocky/clocky-terminal-bash'
  config:
    timeoutMs: 300000

# The editor uses the bare local filesystem; persistent Bash still consumes the
# shared danger-full-access sandbox policy above.
- id: fs-local
  name: '@clocky/clocky-fs-local'
  config:
    cwd: !!js process.env.CLOCKY_CWD ?? process.cwd()

- id: agent-spine
  name: '@clocky/clocky-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.CLOCKY_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistent-bash
  name: '@clocky/clocky-tool-bash-persistent'
  config:
    timeoutMs: 300000
    description: |-
      Run commands in a bash shell
      * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
      * You don't have access to the internet via this tool.
      * You do have access to a mirror of common linux and python packages via apt and pip.
      * State is persistent across command calls and discussions with the user.
      * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
      * Please avoid commands that may produce a very large amount of output.
      * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

- id: str-replace-editor
  name: '@clocky/clocky-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: sessions
  name: '@clocky/clocky-session-persistence-jsonl'
  config:
    root: !!js process.env.CLOCKY_SESSION_ROOT ?? './.sessions'
    compression: none

- id: team-storage
  name: '@clocky/clocky-storage'

- id: team-storage-json
  name: '@clocky/clocky-storage-json'
  config:
    root: !!js "(process.env.CLOCKY_SESSION_ROOT ?? './.sessions') + '/team-hub'"

- id: team-storage-log
  name: '@clocky/clocky-storage-log'
  config:
    backend: json
    routes: {}

- id: team-hub
  name: '@clocky/clocky-team-hub'

- id: team-channel-direct
  name: '@clocky/clocky-team-channel-direct'

- id: team-agent-runtime
  name: '@clocky/clocky-agent-runtime'

- id: team-agent-runtime-in-process
  name: '@clocky/clocky-agent-runtime-in-process'

- id: team-activation-controller
  name: '@clocky/clocky-team-activation-controller'

- id: team-link
  name: '@clocky/clocky-team-link'

- id: team-link-local
  name: '@clocky/clocky-team-link-local'

- id: team-human-actor
  name: '@clocky/clocky-team-human-actor'

- id: team-channel-admission
  name: '@clocky/clocky-team-channel-admission'

- id: team-agent-client
  name: '@clocky/clocky-team-agent-client'

- id: tool-team
  name: '@clocky/clocky-tool-team'

- id: team-run
  name: '@clocky/clocky-team-run'

- id: team-closure-drive-registry
  name: '@clocky/clocky-team-closure-driver/registry'

- id: team-closure-driver-hub
  name: '@clocky/clocky-team-closure-driver/hub'
  config:
    backend: hub

- id: team-closure-driver
  name: '@clocky/clocky-team-closure-driver'
  config:
    backend: hub
    maxTeamsPerDrive: 128
    pageSize: 32
    disposalTimeoutMs: 5000
    pulseIntervalMs: 1000

- id: team-human-client
  name: '@clocky/clocky-team-human-client'
  config:
    storagePageSize: 32
    maxPageSize: 32
    maxDeliveryBytes: 262144
    maxPendingOperations: 128
    watchTimeoutMs: 30000
    pollIntervalMs: 250
