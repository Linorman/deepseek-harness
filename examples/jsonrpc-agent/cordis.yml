# Unattended coding-agent deployment for the bundled clocky-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@clocky/clocky-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.CLOCKY_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.CLOCKY_MAX_TOKENS_AS_SUCCESS)"

# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      test-provider:
        apiKeyEnv: TEST_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:9
        models:
          - id: test-model

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-local'
  config:
    cwd: !!js process.env.CLOCKY_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@clocky/clocky-agent-spine-demo'
  config:
    persona: !!js process.env.CLOCKY_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@clocky/clocky-session-persistence-jsonl'
  config:
    root: !!js process.env.CLOCKY_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.CLOCKY_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@clocky/clocky-session-checkpoint-policy'

- id: subagent
  name: '@clocky/clocky-subagent'

- id: subagent-spawn-in-process
  name: '@clocky/clocky-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@clocky/clocky-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@clocky/clocky-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@clocky/clocky-fs-local'
  config:
    cwd: !!js process.env.CLOCKY_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@clocky/clocky-fs-observation-policy'

- id: tool-fs
  name: '@clocky/clocky-tool-fs'

- id: token-meter
  name: '@clocky/clocky-token-meter'

- id: compaction-basic
  name: '@clocky/clocky-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
