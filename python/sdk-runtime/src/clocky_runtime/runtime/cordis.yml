# Bundled default config. The runtime still requires an explicit
# $CLOCKY_CORDIS_CONFIG or argv path; the SDK injects this path for bundled
# zero-config launches. SDK-set session-root and cwd variables have manual-run fallbacks.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: product-principals
  name: '@clocky/clocky-product-principal'

- id: product-principal-digest
  name: '@clocky/clocky-host-product-principal-digest'
  config:
    providerName: sdk-digest
    credentialSha256: !!js process.env.CLOCKY_PRODUCT_CREDENTIAL_SHA256
    principalId: !!js process.env.CLOCKY_PRODUCT_PRINCIPAL_ID ?? 'sdk-default-user'
    subject: !!js process.env.CLOCKY_PRODUCT_PRINCIPAL_SUBJECT ?? 'sdk-default-user'
    credentialGeneration: !!js Number(process.env.CLOCKY_PRODUCT_CREDENTIAL_GENERATION ?? '1')

- id: sdk-jsonrpc-server
  name: '@clocky/clocky-sdk-jsonrpc-server'
  config:
    productPrincipalProvider: sdk-digest

# Agent spine; TeamRun creates participant-bound coordinator Sessions.
- id: agent-core
  name: '@clocky/clocky-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# A caller-selected route is configured through the generic pi-ai adapter. The
# smoke route is inert by default and resolves its credential through the seam.
- id: llm-pi-ai
  name: '@clocky/clocky-llm-pi-ai'
  config:
    providers:
      test-provider:
        apiKeyEnv: TEST_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:9
        models:
          - id: !!js process.env.TEST_MODEL ?? 'test-model'
      # Explicit local OpenAI-compatible route for keyed development runs.
      # The caller selects this route in Clocky(provider=...), while the
      # default test-provider remains inert and keyless for boot checks.
      local-vllm:
        apiKeyEnv: CLOCKY_LOCAL_MODEL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18000/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
        reasoning: !!js process.env.CLOCKY_LOCAL_MODEL_REASONING_EFFORT ?? undefined
        defaultContextWindow: 131072
        defaultMaxTokens: 5120
        models:
          - id: !!js process.env.CLOCKY_LOCAL_MODEL_ID ?? 'Qwen3.8-27B-AWQ-4bit'
            contextWindow: 131072
            maxTokens: 5120
            reasoningEfforts:
              off:
              minimal: low
              low: low
              medium: medium
              high: xhigh
              xhigh: xhigh
              max: xhigh

- id: agent-default-model
  name: '@clocky/clocky-agent-default-model'
  config:
    provider: test-provider
    model: !!js process.env.TEST_MODEL ?? 'test-model'

# JSONL persistence; $CLOCKY_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@clocky/clocky-session-persistence-jsonl'
  config:
    root: !!js process.env.CLOCKY_SESSION_ROOT ?? './.sessions'

- id: team-storage
  name: '@clocky/clocky-storage'

- id: team-storage-json
  name: '@clocky/clocky-storage-json'
  config:
    root: !!js "(process.env.CLOCKY_SESSION_ROOT ?? './.sessions') + '/team-hub'"

- id: team-storage-log
  name: '@clocky/clocky-storage-log'
  config:
    backend: json
    routes: {}

- id: team-artifact
  name: '@clocky/clocky-team-artifact'

- id: team-artifact-local
  name: '@clocky/clocky-team-artifact-local'
  config:
    root: !!js "(process.env.CLOCKY_SESSION_ROOT ?? './.sessions') + '/team-artifacts'"

- id: team-hub
  name: '@clocky/clocky-team-hub'
  config:
    maxTeamDepth: 1


- id: team-human-client
  name: '@clocky/clocky-team-human-client'
  config:
    storagePageSize: 32
    maxPageSize: 32
    maxDeliveryBytes: 262144
    maxPendingOperations: 128
    watchTimeoutMs: 30000
    pollIntervalMs: 250
- id: team-human-actor
  name: '@clocky/clocky-team-human-actor'

- id: team-channel-basic
  name: '@clocky/clocky-team-channel-basic'

- id: team-channel-summary
  name: '@clocky/clocky-team-channel-summary'
  config:
    allowedPolicies: [directed, summarized-window]
    maxSourceEnvelopes: 64
    maxSourceBytes: 65536
    maxSummaryBytes: 4096
    maxHistorySpan: 128
    disposalTimeoutMs: 5000

- id: team-channel-direct
  name: '@clocky/clocky-team-channel-direct'

- id: team-workspace
  name: '@clocky/clocky-team-workspace'

- id: team-workspace-shared
  name: '@clocky/clocky-team-workspace-shared'
  config:
    root: !!js process.env.CLOCKY_CWD ?? process.cwd()
    allowTeamWorkspacePath: true

- id: team-agent-runtime
  name: '@clocky/clocky-agent-runtime'

- id: team-agent-runtime-in-process
  name: '@clocky/clocky-agent-runtime-in-process'

- id: team-activation-controller
  name: '@clocky/clocky-team-activation-controller'

- id: team-link
  name: '@clocky/clocky-team-link'

- id: team-link-local
  name: '@clocky/clocky-team-link-local'

- id: team-channel-admission
  name: '@clocky/clocky-team-channel-admission'

- id: team-agent-client
  name: '@clocky/clocky-team-agent-client'

- id: tool-team
  name: '@clocky/clocky-tool-team'

- id: tool-team-task
  name: '@clocky/clocky-tool-team-task'

- id: team-delegation
  name: '@clocky/clocky-team-delegation'
  config:
    maxOperationsPerDrive: 32
    channelPageSize: 128
    pulseIntervalMs: 1000

- id: team-run
  name: '@clocky/clocky-team-run'

- id: team-closure-drive-registry
  name: '@clocky/clocky-team-closure-driver/registry'

- id: team-closure-driver-hub
  name: '@clocky/clocky-team-closure-driver/hub'
  config:
    backend: hub

- id: team-closure-driver
  name: '@clocky/clocky-team-closure-driver'
  config:
    backend: hub
    maxTeamsPerDrive: 128
    pageSize: 32
    disposalTimeoutMs: 5000
    pulseIntervalMs: 1000

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@clocky/clocky-session-checkpoint-policy'

# Local bash executor; $CLOCKY_CWD wins over the process cwd.
# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@clocky/clocky-subprocess-local'

- id: bash
  name: '@clocky/clocky-bash-local'
  config:
    cwd: !!js process.env.CLOCKY_CWD ?? process.cwd()

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@clocky/clocky-fs-local'
  config:
    cwd: !!js process.env.CLOCKY_CWD ?? process.cwd()
