[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "clocky-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Clocky runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Clocky" }]

[project.urls]
Homepage = "https://github.com/Linorman/clocky"
Documentation = "https://github.com/Linorman/clocky/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/Linorman/clocky/issues"
Source = "https://github.com/Linorman/clocky"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/clocky_runtime/runtime/clocky-jsonrpc-agent-*"]
exclude = ["src/clocky_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/clocky_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
